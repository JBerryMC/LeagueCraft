name: Build

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: LeagueCraft-plugin
          path: plugin/target/LeagueCraft-*.jar

  datapack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datapack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build with MC-Build
        run: |
          npm i -g mc-build@4.2.0
          mcb build
          test -d data/lc/function && test -f data/settings/function/load.mcfunction
