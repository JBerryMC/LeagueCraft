# LeagueCraft plugin: controls, third-person view and basic attack
#
# The plugin doesn't contain any champion logic. It decides *what* to cast from the key you
# pressed, then runs the datapack's own function as you, so cooldowns, mana, crowd control and the
# HUD keep working exactly as the datapack defines them.
#
# Default layout:
#   left click = basic attack (a hitscan from the crosshair, see basic-attack below)
#   hotbar keys 1-4 = Q/W/E/R (players can rebind Hotbar Slot 1-4 to any keys)
#   Q (drop) = summoner 1    F (swap hands) = summoner 2
#   right click (hold) = zoom, see zoom below
#   sprint and shift don't sprint or crouch (see movement below), so they're free for abilities
#
# While you play a champion your hand rests on hotbar key 8, holding a copy of your weapon.
# Scrolling can only reach keys 7 and 9, so keys 7, 8 and 9 can't be mapped.

# Minecraft action -> what it does. Actions: q, w, e, r, summoner-1, summoner-2, none
keys:
  drop: summoner-1
  swap-hands: summoner-2
  hotbar-1: q
  hotbar-2: w
  hotbar-3: e
  hotbar-4: r
  hotbar-5: none
  hotbar-6: none

# Key labels under the HUD icons. "key.<control>" shows whatever key the player bound to that
# Minecraft control (key.hotbar.1 shows "1", or whatever they rebound Hotbar Slot 1 to). Anything else is shown as
# written; there's room for 1-2 characters. summoner-1 is the label under summoner spell 1.
# These defaults are what the datapack shows by itself, so nothing is written for them. A
# different label is written when someone becomes a champion and after each cast.
# Leave a label empty ("") to keep the datapack's own label.
hud-labels:
  q: "key.hotbar.1"
  w: "key.hotbar.2"
  e: "key.hotbar.3"
  r: "key.hotbar.4"
  summoner-1: "key.drop"

# Show the key setup tip in chat the first time each player plays a champion (/lc keys shows it any time).
first-time-tip: true

# Only handle input while a match is running (score "_ingame" in objective "game" is 1).
# Turn off to test champions with /function lc:menu/champion/<name> outside a match.
require-match: true

# Items the datapack uses for abilities (hotbar slots 1-4). They're never thrown while you play.
ability-items:
  - minecraft:phantom_membrane

# Datapack functions. %s becomes q, w, e or r.
cast-function: "lc:champion/abilities/use_%s"
summoner-1-function: "lc:champion/spell/check"
summoner-2-function: "lc:champion/spell/check_2"

# Over-the-shoulder view while playing a champion. Needs the ShoulderCam shaders, which are part
# of the LeagueCraft resource pack, and players in F5 (third person). Servers can't switch
# perspective for them, so the key tip tells them to press F5.
third-person:
  enabled: true
  # How far behind the player the camera sits (the minecraft:camera_distance attribute, vanilla 4).
  # Vanilla still pulls the camera in at walls.
  camera-distance: 3.0
  # Must match TPS_SHOULDER and TPS_HEIGHT in the resource pack's
  # assets/tpscam/shaders/include/camera.glsl, or shots won't go where the crosshair points.
  shoulder: 0.8
  height: 0.25
  # Draw the crosshair at the end of the champion HUD (vanilla hides it in F5).
  crosshair: true

# Hold right click to zoom. A server can't set the field of view, but Minecraft narrows it when you
# walk slower and eases it in smoothly, so zooming slows you down: each value is how much slower
# (0.3 = 30% slower), and the view narrows by about half that. It ends about 0.25 s after you let
# go. Players who turned FOV Effects down (Options > Accessibility) see less zoom, or none at 0%.
# Champions the datapack tags "melee" use melee, everyone else ranged; zoom.champions sets it for
# one champion by name (its datapack tag). Values must be above 0 and below 1.
zoom:
  enabled: true
  melee: 0.15
  ranged: 0.3
  champions: {}
  # champions:
  #   jhin: 0.5
  #   garen: 0.1

# Champions can't sprint or crouch, so Sprint and Shift are free for abilities.
# Sprinting is stopped by keeping hunger at 6 (Minecraft needs more to sprint; the resource pack
# hides the hunger bar). Crouching doesn't slow you, other players never see it and your hitbox
# stays full height, but your own view still crouches while Shift is held.
movement:
  disable-sprint: true
  disable-sneak: true

# Left click is the basic attack, at most once per click, through the datapack's damage system
# (with every on-hit effect). Melee champions hit every enemy in a cone in front; ranged champions
# hit the first enemy on the crosshair. Allies are never hit and don't block shots.
# Each champion's range, attack speed, ammo and reload time are stats in the datapack's stats chart
# (datapack/src/settings.mcb). Ammo shows in a boss bar; a reload also starts by itself when the
# ammo runs out.
basic-attack:
  # How wide the melee cone is, in degrees.
  melee-angle: 100
  # Key that reloads early: sprint, sneak or none.
  reload-key: sprint

# Log every cast and the datapack's command output to the console.
debug: false
